name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Get tools
      run: |
        sudo apt-get update
        sudo apt-get install -y zip
    - name: Show status
      run: |
        echo "Файлы конфигураций VPN готовы к сборке"
